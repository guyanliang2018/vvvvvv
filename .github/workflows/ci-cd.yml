name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: '部署环境'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - prod

jobs:
  validate:
    name: 验证配置
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform格式检查
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform初始化
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform验证
        run: |
          cd terraform
          terraform validate

      - name: 安装Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Ansible Lint
        run: |
          cd ansible
          ansible-lint playbooks/site.yml

  test:
    name: 测试配置
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq shellcheck

      - name: Shell脚本语法检查
        run: |
          shellcheck scripts/*.sh

      - name: 模拟测试setup.sh
        run: |
          # 创建模拟的setup.sh测试环境
          MOCK_DIR=$(mktemp -d)
          cp scripts/setup.sh "$MOCK_DIR/"
          cd "$MOCK_DIR"
          
          # 模拟测试(不实际执行命令)
          echo "模拟测试setup.sh脚本参数解析和基本逻辑..."
          bash -n setup.sh
          
          # 检查参数处理
          echo "测试参数处理..."
          bash setup.sh --help 2>&1 | grep -q "usage" && echo "参数帮助测试通过"
          
          # 清理
          rm -rf "$MOCK_DIR"

      - name: 测试cloud-init配置
        run: |
          # 验证cloud-init配置语法
          sudo apt-get install -y cloud-init
          for file in cloud-init/*.yml; do
            echo "验证 $file"
            cloud-init devel schema --config-file "$file" || exit 1
          done

      - name: 检查容器配置
        run: |
          # 检查docker-compose文件格式
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          
          find . -name "docker-compose.yml" -exec docker-compose -f {} config --quiet \;

  deploy_test:
    name: 部署测试环境
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'test'
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置AWS凭证
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: 设置Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform初始化和应用(测试环境)
        run: |
          cd terraform/environments/test
          terraform init
          terraform apply -auto-approve -var-file=test.tfvars

      - name: 安装Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: 运行Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory/test playbooks/site.yml

  deploy_prod:
    name: 部署生产环境
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env == 'prod'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置AWS凭证
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: 设置Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform计划(生产环境)
        run: |
          cd terraform/environments/prod
          terraform init
          terraform plan -var-file=prod.tfvars -out=tfplan
          
      - name: Terraform应用(生产环境)
        run: |
          cd terraform/environments/prod
          terraform apply tfplan

      - name: 安装Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: 运行Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventory/prod playbooks/site.yml --limit "tag_Type_new"
