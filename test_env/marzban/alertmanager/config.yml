global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-notifications'
  routes:
  - match:
      severity: critical
    receiver: 'telegram-notifications'
    repeat_interval: 1h
  - match:
      severity: warning
    receiver: 'telegram-notifications'
    repeat_interval: 3h

receivers:
- name: 'telegram-notifications'
  telegram_configs:
  - bot_token: 'your_telegram_bot_token'
    api_url: 'https://api.telegram.org'
    chat_id: 123456789
    parse_mode: 'MarkdownV2'
    message: |
      🚨 *警报 [{{ .Status | toUpper }}]*
      *警报名称:* {{ .CommonAnnotations.summary }}
      *说明:* {{ .CommonAnnotations.description }}
      *严重性:* {{ .CommonLabels.severity | toUpper }}
      *实例:* {{ .CommonLabels.instance }}
      {{ if .Status | eq "firing" }}*发生时间:* {{ .StartsAt | since }}{{ end }}
      {{ if .Status | eq "resolved" }}*持续时间:* {{ .StartsAt | duration .EndsAt }}{{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
