version: '3.3'

services:
  netmaker:
    container_name: netmaker
    image: gravitl/netmaker:v0.20.2
    restart: always
    environment:
      SERVER_HOST: "netmaker.your-domain.com"
      COREDNS_ADDR: "127.0.0.1"
      CLIENT_MODE: "on"
      API_PORT: "8081"
      GRPC_PORT: "50051"
      SERVER_API_CONN_STRING: "api.netmaker.your-domain.com:443"
      GRPC_SSL: "on"
      DNS_MODE: "on"
      MASTER_KEY: "your-secure-master-key"
      DATABASE: "sqlite"
      VERBOSITY: "2"
      DISPLAY_KEYS: "on"
      MQ_ENABLE: "on"
      MQ_SERVER_PORT: "8883"
      MQ_SERVER_USERS: "user:pass123"
      NODE_ID: "netmaker-server"
      DATABASE_CONN: "/root/data/netmaker.db"
      TELEMETRY: "off"
      PLATFORM: "docker"
    volumes:
      - ./data:/root/data
      - ./config:/etc/netmaker
      - ./certs:/etc/netmaker/certs
    networks:
      - netmaker-network
    ports:
      - "51821:51821/udp"
      - "53:53/udp"
      - "8883:8883/tcp"
    cap_add:
      - NET_ADMIN

  caddy:
    container_name: netmaker-caddy
    image: caddy:2-alpine
    restart: always
    environment:
      - ACME_AGREE=true
    depends_on:
      - netmaker
    ports:
      - "80:80"
      - "443:443"
    networks:
      - netmaker-network
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy-data:/data
      - ./caddy-config:/config

networks:
  netmaker-network:
    driver: bridge
