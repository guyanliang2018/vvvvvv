#cloud-config

# 系统基础设置
timezone: Asia/Shanghai
locale: zh_CN.UTF-8
package_update: true
package_upgrade: true

# 安装基础软件包
packages:
  - curl
  - wget
  - git
  - unzip
  - jq
  - socat
  - iptables
  - net-tools
  - htop

# 用户设置 (可选，根据需要配置)
users:
  - name: vpnadmin
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-rsa AAAAB... # 替换为您的SSH公钥

# 安全设置
ssh_pwauth: false

# 运行安装脚本
runcmd:
  - curl -s https://raw.githubusercontent.com/yourusername/vpnhello/main/scripts/setup.sh | bash -s -- --node-name=%node_name% --netmaker-token=%netmaker_token% --marzban-token=%marzban_token% --netmaker-server=%netmaker_server% --marzban-server=%marzban_server%

# 可替换的变量示例：
# %node_name% - 节点名称
# %netmaker_token% - Netmaker令牌
# %marzban_token% - Marzban令牌
# %netmaker_server% - Netmaker服务器地址
# %marzban_server% - Marzban服务器地址

write_files:
  - path: /etc/motd
    content: |
      Welcome to VPN AutoCloud Node
      ---------------------------
      自动化节点配置已完成
      如需帮助请联系管理员
  
  - path: /etc/sysctl.d/99-vpnnode.conf
    content: |
      # 网络优化
      net.ipv4.ip_forward = 1
      net.ipv4.tcp_fastopen = 3
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
      fs.file-max = 65535
      net.core.rmem_max = 26214400
      net.core.wmem_max = 26214400
      
final_message: "VPN节点配置完成，启动时间 $UPTIME 秒"
